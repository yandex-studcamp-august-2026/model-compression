name: Model benchmark

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "experiments/*/CPU"
      - "experiments/*/GPU"
      - "experiments/*/PRIMARY"
      - "experiments/*/forward.py"
      - "experiments/*/*.py"
      - "experiments/*/weights.url"
      - "experiments/*/weights.sha256"
      - "experiments/*/dataset.json"
      - "experiments/*/metrics.json"
      - "experiments/*/conclusion.md"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment directory, e.g. experiments/soft_label_kl_t2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: model-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - run: uv sync --frozen --extra dev --extra storage --extra export --extra cpu
      - run: uv run --frozen --no-sync python -c "import numpy, onnx, onnxruntime, torch; print('export stack ready')"
      - run: uv run --frozen --no-sync make check
      - run: uv run --frozen --no-sync model-bench discover >/dev/null

  discover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      all: ${{ steps.discover.outputs.all }}
      cpu: ${{ steps.discover.outputs.cpu }}
      gpu: ${{ steps.discover.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: discover
        env:
          BASE_SHA: ${{ env.TRUSTED_SHA }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            selection=(--experiment "${MANUAL_EXPERIMENT}")
          else
            selection=(--base "${BASE_SHA}" --head "${SOURCE_SHA}" --primary-only)
          fi
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            PYTHONPATH=src python -m model_bench discover \
              "${selection[@]}" --reject-mixed-infrastructure >/dev/null
          fi
          all="$(PYTHONPATH=src python -m model_bench discover \
            "${selection[@]}" --unique-experiments)"
          cpu="$(PYTHONPATH=src python -m model_bench discover "${selection[@]}" --backend cpu)"
          gpu="$(PYTHONPATH=src python -m model_bench discover "${selection[@]}" --backend gpu)"
          {
            echo "all=${all}"
            echo "cpu=${cpu}"
            echo "gpu=${gpu}"
          } >>"${GITHUB_OUTPUT}"

  reject-fork:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Benchmark candidates from fork pull requests are not accepted." >&2
          exit 1

  fetch-inputs:
    needs: [check, discover]
    if: >-
      needs.discover.outputs.all != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.all) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - run: uv sync --project trusted --frozen --extra storage
      - name: Download checkpoint with trusted code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          CHECKPOINT_BUCKET: ${{ vars.CHECKPOINT_BUCKET }}
          CHECKPOINT_PREFIX: ${{ vars.CHECKPOINT_PREFIX }}
          EXPERIMENT_DIR: ${{ matrix.candidate.directory }}
          S3_ENDPOINT_URL: https://storage.yandexcloud.net
        run: |
          uv run --project trusted --frozen --no-sync \
            python trusted/scripts/fetch_checkpoint.py \
            --source-root source \
            --experiment-dir "${EXPERIMENT_DIR}" \
            --output checkpoint/checkpoint.pt
      - name: Download validation dataset with trusted code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          DATASET_BUCKET: ${{ vars.DATASET_BUCKET }}
          DATASET_PREFIX: ${{ vars.DATASET_PREFIX }}
          EXPERIMENT_DIR: ${{ matrix.candidate.directory }}
          S3_ENDPOINT_URL: https://storage.yandexcloud.net
        run: |
          uv run --project trusted --frozen --no-sync \
            python trusted/scripts/fetch_dataset.py \
            --source-root source \
            --experiment-dir "${EXPERIMENT_DIR}" \
            --output dataset
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-${{ matrix.candidate.name }}
          path: checkpoint/checkpoint.pt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-${{ matrix.candidate.name }}
          path: dataset/
          if-no-files-found: error
          retention-days: 7

  export-onnx:
    needs: [discover, fetch-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.all) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - run: uv sync --frozen --extra export
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checkpoint-${{ matrix.candidate.name }}
          path: checkpoint
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dataset-${{ matrix.candidate.name }}
          path: dataset
      - name: Export ONNX and verify PyTorch parity
        env:
          EXPERIMENT_DIR: ${{ matrix.candidate.directory }}
        run: |
          uv run --frozen --no-sync model-bench export "${EXPERIMENT_DIR}" \
            --weights checkpoint/checkpoint.pt \
            --dataset dataset \
            --output bundles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.candidate.name }}
          path: bundles/${{ matrix.candidate.name }}/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: conversion-failure-${{ matrix.candidate.name }}
          path: bundles/${{ matrix.candidate.name }}/conversion_report.json
          if-no-files-found: warn
          retention-days: 7

  benchmark-cpu:
    needs: [discover, export-onnx]
    if: >-
      always() &&
      needs.discover.outputs.cpu != '[]' &&
      needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.cpu) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - run: uv sync --frozen --extra cpu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-${{ matrix.candidate.name }}
          path: bundles/${{ matrix.candidate.name }}
      - run: |
          uv run --frozen --no-sync model-bench benchmark-cpu \
            --bundle "bundles/${{ matrix.candidate.name }}" \
            --results results \
            --warmup-iterations 20 \
            --iterations 1000 \
            --threads 2 \
            --throughput-workers 4
      - name: Write summary
        run: python scripts/write_summary.py results >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-cpu-${{ matrix.candidate.name }}
          path: results/${{ matrix.candidate.name }}/
          if-no-files-found: warn
          retention-days: 7

  benchmark-gpu:
    needs: [discover, export-onnx]
    if: >-
      always() &&
      needs.discover.outputs.gpu != '[]' &&
      needs.export-onnx.result == 'success' &&
      vars.GPU_BENCH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: yc-gpu-benchmark
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dataset-${{ fromJSON(needs.discover.outputs.gpu)[0].name }}
          path: dataset
      - name: Authenticate in Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: bash trusted/scripts/setup_yc.sh
      - name: Prepare SSH key
        env:
          GPU_SSH_PRIVATE_KEY: ${{ secrets.GPU_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/gpu-ssh-key"
          printf '%s' "${GPU_SSH_PRIVATE_KEY}" >"${RUNNER_TEMP}/gpu-ssh-key"
      - name: Run TensorRT benchmark on V100
        env:
          GPU_SSH_KEY_FILE: ${{ runner.temp }}/gpu-ssh-key
          GPU_SSH_HOST_KEY: ${{ vars.GPU_SSH_HOST_KEY }}
          GPU_SSH_USER: ${{ vars.GPU_SSH_USER }}
          EXPECTED_GPU_MODEL: ${{ vars.EXPECTED_GPU_MODEL }}
          EXPECTED_TENSORRT_VERSION: ${{ vars.EXPECTED_TENSORRT_VERSION }}
          YC_GPU_INSTANCE_ID: ${{ vars.YC_GPU_INSTANCE_ID }}
        run: bash trusted/scripts/run_remote_gpu.sh bundles results trusted dataset
      - name: Write summary
        run: python trusted/scripts/write_summary.py results >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-gpu
          path: results/*/*
          if-no-files-found: warn
          retention-days: 7

  gpu-disabled:
    needs: discover
    if: >-
      needs.discover.outputs.gpu != '[]' &&
      vars.GPU_BENCH_ENABLED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "GPU benchmark is disabled. Use CPU or set GPU_BENCH_ENABLED=true." >&2
          exit 1
